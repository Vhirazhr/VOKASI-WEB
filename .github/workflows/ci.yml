name: VOKASI Web checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Temporary dependency lock audit
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const current = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const original = JSON.parse(cp.execFileSync('git',['show','HEAD:package-lock.json'],{encoding:'utf8'}));
          const changed = Object.fromEntries(Object.entries(current.packages).filter(([path,value])=>JSON.stringify(value)!==JSON.stringify(original.packages[path])));
          console.log('VOKASI_LOCK_DELTA_START'+JSON.stringify(changed)+'VOKASI_LOCK_DELTA_END');
          NODE
      - name: Verify original 500-question bank
        run: npm run check:bank
      - name: Verify approved 100-question / 30-minute blueprint
        run: npm run check:new-bank-blueprint
      - name: Verify exam security contract
        run: npm run check:security
      - name: Lint source
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build Next.js
        run: npm run build
