name: VOKASI Web checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify original 500-question bank
        run: npm run check:bank
      - name: Verify approved 100-question / 30-minute blueprint
        run: npm run check:new-bank-blueprint
      - name: Verify exam security contract
        run: npm run check:security
      - name: Verify self-hosted PostgreSQL security contract
        run: npm run check:self-hosted-db
      - name: Validate local storage migration script
        run: node --check scripts/import-storage-export.mjs
      - name: Lint source
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Verify student chatbot conversations
        run: node scripts/check-vokasi-chatbot.mjs
      - name: Validate student PDF exports
        run: node scripts/check-student-report.mjs
      - name: Verify official grades in generated Excel workbook
        run: node scripts/check-admin-grade-export.mjs
      - name: Build Next.js
        run: npm run build
      - name: Production HTTP route smoke test
        run: node scripts/check-route-smoke.mjs
